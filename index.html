<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEF Quest</title>
<meta name="description" content="Daily French practice for the TEF Canada exam: words, stories, listening, speaking and writing, with games and streaks.">
<meta name="theme-color" content="#060A14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEF Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <a class="logo mono" href="#/" aria-label="TEF Quest home"><span class="prompt">&gt;_</span> tef<span class="dot">.</span>quest</a>
  <div class="hud mono">
    <span class="hchip fl" title="Day streak"><span id="hFlame"></span><b id="hStreak">0</b></span>
    <span class="hchip zp" title="Level"><span id="hZap"></span><b id="hLvl">Lv 1</b></span>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">TEF Quest needs JavaScript to run.</p></noscript>

<script src="js/data/words.js"></script>
<script src="js/data/reading.js"></script>
<script src="js/data/speaking.js"></script>
<script src="js/data/practice.js"></script>
<script src="js/data/resources.js"></script>
<script src="js/core.js"></script>
<script src="js/v-home.js"></script>
<script src="js/v-words.js"></script>
<script src="js/v-read.js"></script>
<script src="js/v-listen.js"></script>
<script src="js/v-speak.js"></script>
<script src="js/v-write.js"></script>
<script src="js/v-quiz.js"></script>
<script src="js/v-extras.js"></script>
<script src="js/main.js"></script>
</body>
</html>
